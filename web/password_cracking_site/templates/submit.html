<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Submission</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            color: white;
            margin-bottom: 10px;
            text-align: center;
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        sub {
            color: #f0f0f0;
            display: block;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9em;
            line-height: 1.6;
        }

        form {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 700px;
            width: 100%;
        }

        .similar-group {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .similar-group:last-of-type {
            background: #e8f5e9;
            border-left-color: #4caf50;
        }

        .form-item {
            margin-bottom: 20px;
        }

        .form-item:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-weight: 600;
            color: #555;
            font-size: 0.9em;
            margin-bottom: 6px;
        }

        .field-code {
            color: #667eea;
            font-family: 'Courier New', monospace;
            font-weight: 700;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.95em;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="text"]:valid {
            border-color: #4caf50;
        }

        .submit-container {
            margin-top: 30px;
            text-align: center;
        }

        button[type="submit"] {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1em;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            form {
                padding: 25px;
            }

            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
<h1>Password Submission Page</h1>
<sub>Please enter passwords following the instructions here.<br>
    Do NOT use your real passwords unless you want them displayed!</sub>

<form action="/post_passwords" method="POST">
    <div class="similar-group">
            <div class="form-item">
                <label for="w4"><span class="field-code">w4:</span> Create a password using 1-4 characters that form a word</label>
                <input type="text" id="w4" name="w4" required placeholder="e.g., cat">
            </div>
            <div class="form-item">
                <label for="ws4"><span class="field-code">ws4:</span> Create a password using 1-4 characters that form a word, include at least one symbol</label>
                <input type="text" id="ws4" name="ws4" required placeholder="e.g., cat!">
            </div>
            <div class="form-item">
                <label for="wsa4"><span class="field-code">wsa4:</span> Create a password using 1-4 characters that form a word, include symbols and numbers</label>
                <input type="text" id="wsa4" name="wsa4" required placeholder="e.g., ca7!">
            </div>
    </div>
    <div class="similar-group">
            <div class="form-item">
                <label for="c4"><span class="field-code">c4:</span> Create a password using 1-4 random characters (doesn't need to be a word)</label>
                <input type="text" id="c4" name="c4" required placeholder="e.g., x9p">
            </div>
            <div class="form-item">
                <label for="cs4"><span class="field-code">cs4:</span> Create a password using 1-4 random characters, include at least one symbol</label>
                <input type="text" id="cs4" name="cs4" required placeholder="e.g., x9@">
            </div>
    </div>
    <div class="similar-group">
            <div class="form-item">
                <label for="w8"><span class="field-code">w8:</span> Create a password using 5-8 characters that form a word</label>
                <input type="text" id="w8" name="w8" required placeholder="e.g., dragon">
            </div>
            <div class="form-item">
                <label for="ws8"><span class="field-code">ws8:</span> Create a password using 5-8 characters that form a word, include at least one symbol</label>
                <input type="text" id="ws8" name="ws8" required placeholder="e.g., dragon$">
            </div>
            <div class="form-item">
                <label for="wsa8"><span class="field-code">wsa8:</span> Create a password using 5-8 characters that form a word, include symbols and numbers</label>
                <input type="text" id="wsa8" name="wsa8" required placeholder="e.g., drag0n$">
            </div>
    </div>
    <div class="similar-group">
            <div class="form-item">
                <label for="c8"><span class="field-code">c8:</span> Create a password using 5-8 random characters (doesn't need to be a word)</label>
                <input type="text" id="c8" name="c8" required placeholder="e.g., k7xm2p">
            </div>
            <div class="form-item">
                <label for="cs8"><span class="field-code">cs8:</span> Create a password using 5-8 random characters, include at least one symbol</label>
                <input type="text" id="cs8" name="cs8" required placeholder="e.g., k7@m2p">
            </div>
    </div>
    <div class="similar-group">
            <div class="form-item">
                <label for="str"><span class="field-code">str:</span> Create your strongest possible password under 12 characters</label>
                <input type="text" id="str" name="str" required placeholder="e.g., Tr0ng!P@ss9">
            </div>
    </div>
    <div class="submit-container">
        <button type="submit">Submit Passwords</button>
    </div>
</form>
</body>
</html>
